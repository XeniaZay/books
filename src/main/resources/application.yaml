spring:
  application:
    name: api
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 1MB

logging:
  level:
    root: INFO
    com.example.mvc: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: loggers,env,health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

  metrics:
    tags:
      service: ${spring.application.name}
      env: ${app.env}
      version: ${app.version}

  info:
    env:
      enabled: true