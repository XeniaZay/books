spring:
  application:
    name: api
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 1MB
  mvc:
    async:
      request-timeout: 10000
  task:
    execution:
      pool:
        core-size: 5
        max-size: 20
        queue-capacity: 100
        thread-name-prefix: mvc-async-

logging:
  level:
    root: INFO
    com.example.mvc: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: loggers,env,health,info,metrics,prometheus,mappings

  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true

  metrics:
    tags:
      service: ${spring.application.name}
      env: ${app.env}
      version: ${app.version}

  info:
    env:
      enabled: true